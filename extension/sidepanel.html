<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 16px;
      background: #111;
      color: #eee;
      font-size: 14px;
    }
    h2 { margin-top: 0; font-size: 18px; }
    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      width: 100%;
      margin: 8px 0;
    }
    button.secondary { background: #374151; }
    button:hover { background: #1d4ed8; }
    button.secondary:hover { background: #4b5563; }
    button:disabled { background: #444; cursor: not-allowed; }
    #extracted, #result {
      background: #1e1e1e;
      border-radius: 8px;
      padding: 12px;
      margin-top: 12px;
      white-space: pre-wrap;
      line-height: 1.5;
      font-size: 13px;
    }
    #extracted { border-left: 3px solid #555; }
    textarea, input {
      width: 100%;
      background: #1e1e1e;
      color: #eee;
      border: 1px solid #444;
      border-radius: 6px;
      padding: 8px;
      font-size: 13px;
      margin-top: 8px;
      box-sizing: border-box;
    }
    textarea { min-height: 80px; }
    .status { color: #888; font-size: 12px; margin-top: 8px; }
    .warning { color: #fbbf24; }
    .label { color: #888; font-size: 11px; text-transform: uppercase; margin-bottom: 4px; }
    .key-row { display: flex; gap: 8px; align-items: center; }
    .key-row input { flex: 1; }
    .key-row button { width: auto; margin: 0; }
  </style>
</head>
<body>
  <h2>Smart Labeling Assistant</h2>
  <p>Uses free Gemini API for fast image understanding.</p>

  <div class="label">Gemini API Key (free from aistudio.google.com)</div>
  <div class="key-row">
    <input type="password" id="apiKey" placeholder="Paste your Gemini API key">
    <button id="saveKey" class="secondary">Save</button>
  </div>
  <div class="status" id="keyStatus"></div>

  <button id="analyze">Analyze this page</button>

  <div class="label">Extracted (verify this is correct)</div>
  <div id="extracted">Click the button to extract.</div>

  <div class="label">Recommendation</div>
  <div id="result">Waiting...</div>

  <div class="label">Correction / Feedback (optional)</div>
  <textarea id="feedback" placeholder="e.g. The heatmap shows a big difference in Image 1..."></textarea>
  <button id="correct" class="secondary">Re-evaluate with feedback</button>

  <div class="status" id="status"></div>
  <script src="sidepanel.js"></script>
</body>
</html>
