<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 16px;
      background: #111;
      color: #eee;
      font-size: 14px;
    }
    h2 { margin-top: 0; font-size: 18px; }
    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      width: 100%;
      margin: 8px 0;
    }
    button:hover { background: #1d4ed8; }
    button:disabled { background: #444; cursor: not-allowed; }
    #result {
      background: #1e1e1e;
      border-radius: 8px;
      padding: 12px;
      margin-top: 12px;
      white-space: pre-wrap;
      line-height: 1.5;
      min-height: 80px;
    }
    .status { color: #888; font-size: 12px; margin-top: 8px; }
    .warning { color: #fbbf24; }
  </style>
</head>
<body>
  <h2>Smart Labeling Assistant</h2>
  <p>Works on the current page. Extracts the prompt and options, then asks your local model.</p>
  <button id="analyze">Analyze this page</button>
  <div id="result">Click the button to get a recommendation.</div>
  <div class="status" id="status"></div>
  <script src="sidepanel.js"></script>
</body>
</html>
